<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>파주사업소 스마트 보고서</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Pretendard', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; -webkit-tap-highlight-color: transparent; user-select: none; color: #f1f5f9; }
        input, textarea, select { user-select: text !important; }
        ::-webkit-scrollbar { display: none; }
        
        .tab-btn { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .tab-active { background: #334155; color: #60a5fa; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); font-weight: 800; border: 1px solid #475569; }
        .tab-inactive { color: #94a3b8; font-weight: 600; background: transparent; }

        textarea { resize: none; line-height: 1.65; letter-spacing: -0.02em; overflow-y: hidden; }
        select { text-align-last: center; }

        @keyframes soft-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
        .animate-soft-pulse { animation: soft-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="pb-16 antialiased">

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 w-full max-w-[300px] px-4 pointer-events-none"></div>

    <div class="max-w-md mx-auto px-3.5 pt-3.5 space-y-3.5 relative">

        <!-- 슬림 헤더 영역 -->
        <header class="bg-slate-800 rounded-2xl px-4 py-3 border border-slate-700 shadow-lg relative overflow-hidden flex justify-between items-center">
            <div class="absolute -right-6 -top-6 w-28 h-28 bg-blue-500/15 rounded-full blur-2xl pointer-events-none"></div>
            
            <div class="relative z-10">
                <div class="flex items-center gap-1.5 mb-0.5">
                    <div class="w-2 h-2 rounded-full bg-blue-400 animate-soft-pulse"></div>
                    <span class="text-[9px] font-bold text-blue-400 tracking-wider uppercase">Paju Power Plant</span>
                    <span class="text-[9px] font-bold text-yellow-400/90 ml-1">• 천재 탱PL</span>
                </div>
                <h1 class="text-lg font-extrabold text-white tracking-tight leading-tight">스마트 보고서</h1>
            </div>

            <button onclick="fetchWeather()" class="relative z-10 flex items-center gap-2 px-2.5 py-1.5 bg-slate-900/90 border border-slate-700 rounded-xl active:scale-95 transition-transform">
                <span id="weather-icon" class="text-base">🌤️</span>
                <div class="flex flex-col items-start">
                    <span id="quick-weather-temp" class="text-xs font-extrabold text-white leading-none">--°C</span>
                    <span id="quick-weather-desc" class="text-[9px] font-semibold text-slate-400 leading-none mt-0.5">동기화</span>
                </div>
                <i id="weather-spinner" class="fa-solid fa-rotate-right text-[9px] text-slate-500"></i>
            </button>
        </header>

        <!-- 2개 탭 네비게이션 -->
        <nav class="sticky top-2.5 z-40 grid grid-cols-2 gap-1.5 p-1.5 bg-slate-900/90 backdrop-blur-md rounded-2xl border border-slate-700 shadow-lg">
            <button onclick="switchTab('dispatch')" id="tab-dispatch" class="tab-btn py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 tab-active">
                <i class="fa-solid fa-tower-broadcast text-[13px] text-amber-400"></i> 급전 지시
            </button>
            <button onclick="switchTab('grid')" id="tab-grid" class="tab-btn py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 tab-inactive">
                <i class="fa-solid fa-network-wired text-[13px] text-cyan-400"></i> 계통 조작
            </button>
        </nav>

        <!-- ============================================== -->
        <!-- [탭 1] 급전 지시 (Dispatch) -->
        <!-- ============================================== -->
        <div id="panel-dispatch" class="space-y-3.5">
            
            <div class="bg-slate-800 rounded-2xl p-4 space-y-4 border border-slate-700 border-l-4 border-l-amber-500 shadow-md">
                
                <!-- 시간 설정 -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-[11px] font-bold text-slate-300">지시 시간</label>
                        <button onclick="setNow('d')" class="px-2.5 py-1 bg-amber-500/15 border border-amber-500/40 rounded-lg text-[10px] text-amber-400 font-extrabold flex items-center gap-1 active:scale-95 transition-transform">
                            <i class="fa-regular fa-clock"></i> 현재시간
                        </button>
                    </div>
                    
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 space-y-2.5">
                        <div class="flex items-center justify-center gap-3">
                            <div class="relative bg-slate-800 border border-slate-600 rounded-xl px-3 py-1.5">
                                <select id="d-hour" onchange="updateTimeFromSelects('d')" class="bg-transparent text-xl font-black text-white outline-none appearance-none pr-3 cursor-pointer text-center w-12"></select>
                                <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[9px] text-slate-400 pointer-events-none"><i class="fa-solid fa-chevron-down"></i></span>
                            </div>
                            <span class="text-xl font-black text-slate-500">:</span>
                            <div class="relative bg-slate-800 border border-slate-600 rounded-xl px-3 py-1.5">
                                <select id="d-minute" onchange="updateTimeFromSelects('d')" class="bg-transparent text-xl font-black text-white outline-none appearance-none pr-3 cursor-pointer text-center w-12"></select>
                                <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[9px] text-slate-400 pointer-events-none"><i class="fa-solid fa-chevron-down"></i></span>
                            </div>
                        </div>
                        
                        <!-- 1분 단위 포함 7버튼 퀵조정 -->
                        <div class="grid grid-cols-7 gap-1 pt-2 border-t border-slate-800">
                            <button onclick="adjustTimeBy('d', -10)" class="py-2 bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-300 rounded-lg active:scale-95">-10</button>
                            <button onclick="adjustTimeBy('d', -5)" class="py-2 bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-300 rounded-lg active:scale-95">-5</button>
                            <button onclick="adjustTimeBy('d', -1)" class="py-2 bg-slate-800 border border-slate-600 text-[10px] font-extrabold text-amber-300 rounded-lg active:scale-95">-1</button>
                            <button onclick="adjustTimeBy('d', 0)" class="py-2 bg-amber-500/15 border border-amber-500/50 text-[10px] font-black text-amber-400 rounded-lg active:scale-95">정각</button>
                            <button onclick="adjustTimeBy('d', 1)" class="py-2 bg-slate-800 border border-slate-600 text-[10px] font-extrabold text-amber-300 rounded-lg active:scale-95">+1</button>
                            <button onclick="adjustTimeBy('d', 5)" class="py-2 bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-300 rounded-lg active:scale-95">+5</button>
                            <button onclick="adjustTimeBy('d', 10)" class="py-2 bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-300 rounded-lg active:scale-95">+10</button>
                        </div>
                    </div>
                    <input type="hidden" id="d-time" value="">
                </div>
                
                <!-- 대상 호기 선택 -->
                <div class="space-y-1.5">
                    <label class="block text-[11px] font-bold text-slate-300">대상 호기 <span class="text-[10px] font-normal text-slate-400">(계통조작 탭과 자동 연동)</span></label>
                    <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-900 rounded-xl border border-slate-700">
                        <button id="btn-dispatch-target-1" onclick="syncTarget('1')" class="text-xs font-extrabold py-2.5 rounded-lg transition-all text-amber-400 bg-slate-800 border border-amber-500/50">#1CC</button>
                        <button id="btn-dispatch-target-2" onclick="syncTarget('2')" class="text-xs font-extrabold py-2.5 rounded-lg transition-all text-slate-500 bg-transparent border border-transparent">#2CC</button>
                    </div>
                </div>

                <!-- 지시 문구 빠른 생성 -->
                <div class="space-y-2 pt-2 border-t border-slate-700/80">
                    <div class="flex justify-between items-center">
                        <label class="text-[11px] font-bold text-slate-300">지시 문구 생성</label>
                        <button onclick="toggleDispatchAppend()" id="btn-d-mode" class="px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-600 text-[10px] font-bold text-slate-300 active:scale-95">
                            방식: <span class="text-amber-400">새로 쓰기</span>
                        </button>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="dMake('2+1 계통연결')" class="py-3 bg-slate-900 border border-slate-700 hover:border-amber-500/50 rounded-xl text-xs font-bold text-slate-200 active:scale-95 transition-all">2+1 연결</button>
                        <button onclick="dMake('1+1 계통연결')" class="py-3 bg-slate-900 border border-slate-700 hover:border-amber-500/50 rounded-xl text-xs font-bold text-slate-200 active:scale-95 transition-all">1+1 연결</button>
                        <button onclick="dMake('GT 추가 계통연결')" class="py-3 bg-slate-900 border border-slate-700 hover:border-amber-500/50 rounded-xl text-xs font-bold text-slate-200 active:scale-95 transition-all col-span-2">GT 추가 계통연결</button>
                        <button onclick="dMake('계통분리')" class="py-3 bg-slate-900 border border-slate-700 hover:border-red-500/50 rounded-xl text-xs font-bold text-red-300 active:scale-95 transition-all">전체 계통분리</button>
                        <button onclick="dMake('GT 1대 계통분리')" class="py-3 bg-slate-900 border border-slate-700 hover:border-red-500/50 rounded-xl text-xs font-bold text-red-300 active:scale-95 transition-all">GT 1대 분리</button>
                    </div>
                </div>
            </div>

            <!-- 급전지시 에디터 (복사 버튼 상단 분리로 글자 가림 해결) -->
            <div class="bg-[#0b1120] rounded-2xl shadow-xl border border-slate-700 overflow-hidden">
                <div class="flex justify-between items-center px-3.5 py-2.5 bg-[#1e293b] border-b border-slate-700">
                    <span class="text-[11px] font-bold text-amber-400">Dispatch_Memo.txt</span>
                    <div class="flex items-center gap-1.5">
                        <button onclick="clearMemo('memo-dispatch')" class="text-[10px] text-slate-300 bg-slate-700 hover:bg-slate-600 px-2.5 py-1.5 rounded-lg font-bold active:scale-95">
                            비우기
                        </button>
                        <button onclick="copyMemo('memo-dispatch')" class="text-[11px] bg-amber-600 hover:bg-amber-500 text-white px-3 py-1.5 rounded-lg font-extrabold flex items-center gap-1 shadow-md active:scale-95">
                            <i class="fa-regular fa-copy"></i> 복사하기
                        </button>
                    </div>
                </div>
                <textarea id="memo-dispatch" oninput="autoResize(this); saveLocal();" class="w-full min-h-[110px] bg-transparent text-amber-300 p-4 font-mono text-[13px] outline-none placeholder-slate-600" placeholder="위 버튼을 누르면 급전지시 문구가 생성됩니다."></textarea>
            </div>
        </div>


        <!-- ============================================== -->
        <!-- [탭 2] 계통 조작 (Grid) -->
        <!-- ============================================== -->
        <div id="panel-grid" class="hidden space-y-3.5">
            
            <div class="bg-slate-800 rounded-2xl p-4 space-y-4 border border-slate-700 border-l-4 border-l-cyan-500 shadow-md">
                
                <!-- 기준 시간 설정 -->
                <div class="space-y-2">
                    <div class="flex justify-between items-center">
                        <label class="text-[11px] font-bold text-slate-300">조작 시각</label>
                        <button onclick="setNow('g')" class="px-2.5 py-1 bg-cyan-500/15 border border-cyan-500/40 rounded-lg text-[10px] text-cyan-400 font-extrabold flex items-center gap-1 active:scale-95 transition-transform">
                            <i class="fa-regular fa-clock"></i> 현재시간
                        </button>
                    </div>
                    
                    <div class="bg-slate-900 border border-slate-700 rounded-xl p-2.5 space-y-2.5">
                        <div class="flex items-center justify-center gap-3">
                            <div class="relative bg-slate-800 border border-slate-600 rounded-xl px-3 py-1.5">
                                <select id="g-hour" onchange="updateTimeFromSelects('g')" class="bg-transparent text-xl font-black text-white outline-none appearance-none pr-3 cursor-pointer text-center w-12"></select>
                                <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[9px] text-slate-400 pointer-events-none"><i class="fa-solid fa-chevron-down"></i></span>
                            </div>
                            <span class="text-xl font-black text-slate-500">:</span>
                            <div class="relative bg-slate-800 border border-slate-600 rounded-xl px-3 py-1.5">
                                <select id="g-minute" onchange="updateTimeFromSelects('g')" class="bg-transparent text-xl font-black text-white outline-none appearance-none pr-3 cursor-pointer text-center w-12"></select>
                                <span class="absolute right-2 top-1/2 -translate-y-1/2 text-[9px] text-slate-400 pointer-events-none"><i class="fa-solid fa-chevron-down"></i></span>
                            </div>
                        </div>

                        <!-- 1분 단위 포함 7버튼 퀵조정 -->
                        <div class="grid grid-cols-7 gap-1 pt-2 border-t border-slate-800">
                            <button onclick="adjustTimeBy('g', -10)" class="py-2 bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-300 rounded-lg active:scale-95">-10</button>
                            <button onclick="adjustTimeBy('g', -5)" class="py-2 bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-300 rounded-lg active:scale-95">-5</button>
                            <button onclick="adjustTimeBy('g', -1)" class="py-2 bg-slate-800 border border-slate-600 text-[10px] font-extrabold text-cyan-300 rounded-lg active:scale-95">-1</button>
                            <button onclick="adjustTimeBy('g', 0)" class="py-2 bg-cyan-500/15 border border-cyan-500/50 text-[10px] font-black text-cyan-400 rounded-lg active:scale-95">정각</button>
                            <button onclick="adjustTimeBy('g', 1)" class="py-2 bg-slate-800 border border-slate-600 text-[10px] font-extrabold text-cyan-300 rounded-lg active:scale-95">+1</button>
                            <button onclick="adjustTimeBy('g', 5)" class="py-2 bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-300 rounded-lg active:scale-95">+5</button>
                            <button onclick="adjustTimeBy('g', 10)" class="py-2 bg-slate-800 border border-slate-700 text-[10px] font-bold text-slate-300 rounded-lg active:scale-95">+10</button>
                        </div>
                    </div>
                    <input type="hidden" id="g-time" value="">
                </div>
                
                <!-- 대상 호기 선택 -->
                <div class="space-y-1.5">
                    <label class="block text-[11px] font-bold text-slate-300">대상 호기</label>
                    <div class="grid grid-cols-2 gap-1.5 p-1 bg-slate-900 rounded-xl border border-slate-700">
                        <button id="btn-grid-target-1" onclick="syncTarget('1')" class="text-xs font-extrabold py-2.5 rounded-lg transition-all text-cyan-400 bg-slate-800 border border-cyan-500/50">#1CC (11/12/10)</button>
                        <button id="btn-grid-target-2" onclick="syncTarget('2')" class="text-xs font-extrabold py-2.5 rounded-lg transition-all text-slate-500 bg-transparent border border-transparent">#2CC (21/22/20)</button>
                    </div>
                </div>

                <!-- 연결 / 분리 추가 -->
                <div class="grid grid-cols-2 gap-2.5">
                    <div class="p-2.5 bg-slate-900 rounded-xl border border-slate-700">
                        <label class="block text-emerald-400 text-[11px] font-extrabold mb-2 text-center">계통 연결 추가</label>
                        <div class="flex flex-col gap-1.5">
                            <button onclick="gAddConnect('GT1')" id="lbl-conn-gt1" class="py-2 bg-slate-800 border border-slate-600 rounded-lg text-[11px] font-bold text-slate-200 active:scale-95">11GT 연결</button>
                            <button onclick="gAddConnect('GT2')" id="lbl-conn-gt2" class="py-2 bg-slate-800 border border-slate-600 rounded-lg text-[11px] font-bold text-slate-200 active:scale-95">12GT 연결</button>
                            <button onclick="gAddConnect('ST')" id="lbl-conn-st" class="py-2 bg-slate-800 border border-slate-600 rounded-lg text-[11px] font-bold text-slate-200 active:scale-95">10ST 연결</button>
                        </div>
                    </div>
                    
                    <div class="p-2.5 bg-slate-900 rounded-xl border border-slate-700">
                        <label class="block text-rose-400 text-[11px] font-extrabold mb-2 text-center">계통 분리 추가</label>
                        <div class="flex flex-col gap-1.5">
                            <button onclick="gAddSeparateSingle('GT1')" id="lbl-sep-gt1" class="py-2 bg-slate-800 border border-slate-600 rounded-lg text-[11px] font-bold text-slate-200 active:scale-95">11GT 분리</button>
                            <button onclick="gAddSeparateSingle('GT2')" id="lbl-sep-gt2" class="py-2 bg-slate-800 border border-slate-600 rounded-lg text-[11px] font-bold text-slate-200 active:scale-95">12GT 분리</button>
                            <button onclick="gAddSeparateSingle('ST')" id="lbl-sep-st" class="py-2 bg-slate-800 border border-slate-600 rounded-lg text-[11px] font-bold text-slate-200 active:scale-95">10ST 분리</button>
                        </div>
                    </div>
                </div>

                <!-- AGC 및 시차분리 매크로 -->
                <div class="grid grid-cols-2 gap-2.5">
                    <div class="p-2.5 bg-slate-900 rounded-xl border border-slate-700">
                        <label class="block text-indigo-400 text-[11px] font-extrabold mb-2 text-center">AGC 제어</label>
                        <div class="flex flex-col gap-1.5">
                            <button onclick="gAddAgc('2+1')" class="py-2 bg-slate-800 border border-indigo-500/40 rounded-lg text-[11px] font-bold text-indigo-300 active:scale-95">AGC On (2+1)</button>
                            <button onclick="gAddAgc('1+1')" class="py-2 bg-slate-800 border border-indigo-500/40 rounded-lg text-[11px] font-bold text-indigo-300 active:scale-95">AGC On (1+1)</button>
                        </div>
                    </div>
                    
                    <div class="p-2.5 bg-cyan-950/40 rounded-xl border border-cyan-500/30 flex flex-col">
                        <label class="block text-cyan-400 text-[11px] font-extrabold mb-2 text-center">시차분리 매크로</label>
                        <button onclick="gAddSeparate('2+1')" class="flex-1 w-full bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg text-xs font-extrabold shadow-sm active:scale-95 transition-all flex flex-col items-center justify-center py-2">
                            <span>2+1 분리 연산</span>
                            <span class="text-[9px] font-normal opacity-90 mt-0.5">-19분 / -10분 / -2분</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 계통조작 에디터 (실행취소 / 시간정렬 / 상단 복사버튼) -->
            <div class="bg-[#0b1120] rounded-2xl shadow-xl border border-slate-700 overflow-hidden">
                <div class="flex justify-between items-center px-3 py-2.5 bg-[#1e293b] border-b border-slate-700 gap-1">
                    <span class="text-[11px] font-bold text-cyan-400 truncate">Grid_Operation.txt</span>
                    <div class="flex items-center gap-1 shrink-0">
                        <button onclick="undoGridMemo()" title="마지막 줄 삭제" class="text-[10px] text-amber-300 bg-slate-800 border border-slate-600 px-2 py-1.5 rounded-lg font-bold active:scale-95">
                            <i class="fa-solid fa-rotate-left"></i> 취소
                        </button>
                        <button onclick="sortGridMemo()" title="시간순 정렬" class="text-[10px] text-cyan-300 bg-slate-800 border border-slate-600 px-2 py-1.5 rounded-lg font-bold active:scale-95">
                            <i class="fa-solid fa-arrow-down-1-9"></i> 정렬
                        </button>
                        <button onclick="clearMemo('memo-grid')" title="전체 비우기" class="text-[10px] text-slate-300 bg-slate-700 px-2 py-1.5 rounded-lg font-bold active:scale-95">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                        <button onclick="copyMemo('memo-grid')" class="text-[11px] bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg font-extrabold flex items-center gap-1 shadow-md active:scale-95 ml-0.5">
                            <i class="fa-regular fa-copy"></i> 복사
                        </button>
                    </div>
                </div>
                <textarea id="memo-grid" oninput="autoResize(this); saveLocal();" class="w-full min-h-[145px] bg-transparent text-cyan-300 p-4 font-mono text-[13px] outline-none placeholder-slate-600 leading-relaxed" placeholder="버튼을 누르면 여기에 조작 문구가 누적됩니다."></textarea>
            </div>
        </div>

    </div>

    <script>
        let currentBlock = '1'; // '1' (#1CC) 또는 '2' (#2CC) 통합 관리
        let dispatchAppendMode = false; // false: 덮어쓰기, true: 줄 추가

        function initSelects() {
            ['d-hour', 'g-hour'].forEach(id => {
                const select = document.getElementById(id);
                if(!select) return;
                select.innerHTML = '';
                for(let i = 0; i <= 23; i++) {
                    const val = String(i).padStart(2, '0');
                    select.add(new Option(val, val));
                }
            });

            ['d-minute', 'g-minute'].forEach(id => {
                const select = document.getElementById(id);
                if(!select) return;
                select.innerHTML = '';
                for(let i = 0; i <= 59; i++) {
                    const val = String(i).padStart(2, '0');
                    select.add(new Option(val, val));
                }
            });
        }

        window.onload = function() {
            initSelects();

            if(!loadLocal()) {
                setNowSilent('d');
                setNowSilent('g');
                syncTarget('1');
            }

            fetchWeather();
            switchTab('dispatch');
        }

        function saveLocal() {
            const data = {
                memoDispatch: document.getElementById('memo-dispatch').value,
                memoGrid: document.getElementById('memo-grid').value,
                dHour: document.getElementById('d-hour').value,
                dMinute: document.getElementById('d-minute').value,
                gHour: document.getElementById('g-hour').value,
                gMinute: document.getElementById('g-minute').value,
                currentBlock: currentBlock
            };
            localStorage.setItem('pajuReportDataV9', JSON.stringify(data));
        }

        function loadLocal() {
            const saved = localStorage.getItem('pajuReportDataV9');
            if(!saved) return false;
            try {
                const data = JSON.parse(saved);
                document.getElementById('memo-dispatch').value = data.memoDispatch || '';
                document.getElementById('memo-grid').value = data.memoGrid || '';

                document.getElementById('d-hour').value = data.dHour || '00';
                document.getElementById('d-minute').value = data.dMinute || '00';
                document.getElementById('g-hour').value = data.gHour || '00';
                document.getElementById('g-minute').value = data.gMinute || '00';

                document.getElementById('d-time').value = `${data.dHour || '00'}:${data.dMinute || '00'}`;
                document.getElementById('g-time').value = `${data.gHour || '00'}:${data.gMinute || '00'}`;

                syncTarget(data.currentBlock || '1', true);
                return true;
            } catch(e) {
                return false;
            }
        }

        async function fetchWeather() {
            const spinner = document.getElementById('weather-spinner');
            const tempLabel = document.getElementById('quick-weather-temp');
            const descLabel = document.getElementById('quick-weather-desc');
            const iconLabel = document.getElementById('weather-icon');
            
            spinner.classList.add('animate-spin');
            descLabel.innerText = '동기화중';

            try {
                const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.8544&longitude=126.7881&current=temperature_2m,weather_code&timezone=Asia/Seoul');
                const data = await res.json();
                const temp = data.current.temperature_2m;
                const code = data.current.weather_code;

                let txt = '흐림', icon = '☁️';
                if(code === 0) { txt = '맑음'; icon = '☀️'; }
                else if(code <= 3 || code === 45 || code === 48) { txt = '흐림'; icon = '☁️'; }
                else if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) { txt = '비'; icon = '🌧️'; }
                else if([71,73,75,77,85,86].includes(code)) { txt = '눈'; icon = '❄️'; }

                tempLabel.innerText = `${temp.toFixed(1)}°C`;
                descLabel.innerText = txt;
                iconLabel.innerText = icon;
            } catch(e) {
                descLabel.innerText = "오프라인";
            } finally {
                spinner.classList.remove('animate-spin');
            }
        }

        function switchTab(t) {
            ['dispatch', 'grid'].forEach(tab => {
                const btn = document.getElementById(`tab-${tab}`);
                const pnl = document.getElementById(`panel-${tab}`);
                if(t === tab) {
                    btn.classList.add('tab-active');
                    btn.classList.remove('tab-inactive');
                    pnl.classList.remove('hidden');
                } else {
                    btn.classList.add('tab-inactive');
                    btn.classList.remove('tab-active');
                    pnl.classList.add('hidden');
                }
            });
            document.querySelectorAll('textarea').forEach(el => autoResize(el));
        }

        // 두 탭의 대상 호기(#1CC / #2CC) 및 버튼 라벨 실시간 동기화
        function syncTarget(block, silent = false) {
            currentBlock = block;

            const d1 = document.getElementById('btn-dispatch-target-1');
            const d2 = document.getElementById('btn-dispatch-target-2');
            const g1 = document.getElementById('btn-grid-target-1');
            const g2 = document.getElementById('btn-grid-target-2');

            if(block === '1') {
                d1.className = "text-xs font-extrabold py-2.5 rounded-lg transition-all text-amber-400 bg-slate-800 border border-amber-500/50";
                d2.className = "text-xs font-extrabold py-2.5 rounded-lg transition-all text-slate-500 bg-transparent border border-transparent";
                g1.className = "text-xs font-extrabold py-2.5 rounded-lg transition-all text-cyan-400 bg-slate-800 border border-cyan-500/50";
                g2.className = "text-xs font-extrabold py-2.5 rounded-lg transition-all text-slate-500 bg-transparent border border-transparent";
            } else {
                d1.className = "text-xs font-extrabold py-2.5 rounded-lg transition-all text-slate-500 bg-transparent border border-transparent";
                d2.className = "text-xs font-extrabold py-2.5 rounded-lg transition-all text-amber-400 bg-slate-800 border border-amber-500/50";
                g1.className = "text-xs font-extrabold py-2.5 rounded-lg transition-all text-slate-500 bg-transparent border border-transparent";
                g2.className = "text-xs font-extrabold py-2.5 rounded-lg transition-all text-cyan-400 bg-slate-800 border border-cyan-500/50";
            }

            // 3번 탭 버튼 텍스트도 호기에 맞춰 직관적으로 변경
            const gt1 = block === '1' ? '11GT' : '21GT';
            const gt2 = block === '1' ? '12GT' : '22GT';
            const st  = block === '1' ? '10ST' : '20ST';

            document.getElementById('lbl-conn-gt1').innerText = `${gt1} 연결`;
            document.getElementById('lbl-conn-gt2').innerText = `${gt2} 연결`;
            document.getElementById('lbl-conn-st').innerText  = `${st} 연결`;
            document.getElementById('lbl-sep-gt1').innerText  = `${gt1} 분리`;
            document.getElementById('lbl-sep-gt2').innerText  = `${gt2} 분리`;
            document.getElementById('lbl-sep-st').innerText   = `${st} 분리`;

            if(!silent) saveLocal();
        }

        function toggleDispatchAppend() {
            dispatchAppendMode = !dispatchAppendMode;
            const btn = document.getElementById('btn-d-mode');
            if(dispatchAppendMode) {
                btn.innerHTML = '방식: <span class="text-emerald-400">줄 추가</span>';
                showToast('기존 지시 아래에 줄이 추가됩니다.');
            } else {
                btn.innerHTML = '방식: <span class="text-amber-400">새로 쓰기</span>';
                showToast('버튼 클릭 시 새 문구로 덮어씁니다.');
            }
        }

        function updateTimeFromSelects(prefix) {
            const h = document.getElementById(`${prefix}-hour`).value;
            const m = document.getElementById(`${prefix}-minute`).value;
            document.getElementById(`${prefix}-time`).value = `${h}:${m}`;
            saveLocal();
        }

        function setNowSilent(prefix) {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById(`${prefix}-hour`).value = h;
            document.getElementById(`${prefix}-minute`).value = m;
            document.getElementById(`${prefix}-time`).value = `${h}:${m}`;
        }

        function setNow(prefix) {
            setNowSilent(prefix);
            saveLocal();
            const cur = document.getElementById(`${prefix}-time`).value;
            showToast(`현재 시각 (${cur}) 반영`);
        }

        function adjustTimeBy(prefix, mins) {
            let h = parseInt(document.getElementById(`${prefix}-hour`).value) || 0;
            let m = parseInt(document.getElementById(`${prefix}-minute`).value) || 0;
            if (mins === 0) {
                m = 0;
            } else {
                let d = new Date();
                d.setHours(h, m + mins, 0);
                h = d.getHours();
                m = d.getMinutes();
            }
            document.getElementById(`${prefix}-hour`).value = String(h).padStart(2, '0');
            document.getElementById(`${prefix}-minute`).value = String(m).padStart(2, '0');
            updateTimeFromSelects(prefix);
        }

        function dMake(type) {
            const time = document.getElementById('d-time').value;
            if(!time) return;
            const target = currentBlock === '1' ? '#1CC' : '#2CC';
            const line = `${time} ${target} ${type}`;
            const memoEl = document.getElementById('memo-dispatch');

            if(dispatchAppendMode && memoEl.value.trim() !== '') {
                memoEl.value = memoEl.value.trimEnd() + `\n${line}`;
            } else {
                memoEl.value = `급전지시입니다.\n${line}`;
            }
            autoResize(memoEl);
            saveLocal();
            showToast(`${target} 급전지시 반영`);
        }

        function appendGridMemo(str) {
            const memo = document.getElementById('memo-grid');
            if(memo.value && memo.value.trim() !== "") {
                memo.value = memo.value.trimEnd() + "\n" + str;
            } else {
                memo.value = str;
            }
            autoResize(memo);
            saveLocal();
        }

        function undoGridMemo() {
            const memo = document.getElementById('memo-grid');
            const lines = memo.value.split('\n').filter(l => l.trim() !== '');
            if(lines.length === 0) return;
            lines.pop();
            memo.value = lines.join('\n');
            autoResize(memo);
            saveLocal();
            showToast('마지막 줄을 취소했습니다.');
        }

        function sortGridMemo() {
            const memo = document.getElementById('memo-grid');
            const lines = memo.value.split('\n').filter(l => l.trim() !== '');
            if(lines.length < 2) return;
            lines.sort((a, b) => {
                const timeA = a.match(/^(\d{2}:\d{2})/);
                const timeB = b.match(/^(\d{2}:\d{2})/);
                if(timeA && timeB) return timeA[1].localeCompare(timeB[1]);
                return 0;
            });
            memo.value = lines.join('\n');
            autoResize(memo);
            saveLocal();
            showToast('시간순으로 정렬했습니다.');
        }

        function clearMemo(id) {
            const el = document.getElementById(id);
            el.value = '';
            autoResize(el);
            saveLocal();
            showToast('메모장을 비웠습니다.');
        }

        function getGTargetName(type) {
            if(type === 'GT1') return currentBlock === '1' ? '11GT' : '21GT';
            if(type === 'GT2') return currentBlock === '1' ? '12GT' : '22GT';
            if(type === 'ST')  return currentBlock === '1' ? '10ST' : '20ST';
        }

        function gAddConnect(type) {
            const time = document.getElementById('g-time').value;
            if(!time) return;
            const name = getGTargetName(type);
            appendGridMemo(`${time} #${name} 계통연결`);
            showToast(`${time} #${name} 연결 추가`);
        }

        function gAddSeparateSingle(type) {
            const time = document.getElementById('g-time').value;
            if(!time) return;
            const name = getGTargetName(type);
            appendGridMemo(`${time} #${name} 계통분리`);
            showToast(`${time} #${name} 분리 추가`);
        }

        function gAddAgc(mode) {
            const time = document.getElementById('g-time').value;
            if(!time) return;
            const block = currentBlock === '1' ? '#1CC' : '#2CC';
            appendGridMemo(`${time} ${block} AGC On (${mode})`);
            showToast(`${block} AGC On 추가`);
        }

        function subMins(timeStr, mins) {
            const [h, m] = timeStr.split(':').map(Number);
            let d = new Date();
            d.setHours(h, m - mins, 0);
            return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        function gAddSeparate(mode) {
            const time = document.getElementById('g-time').value;
            if(!time) return;
            const stName = getGTargetName('ST');
            const gt1Name = getGTargetName('GT1');
            const gt2Name = getGTargetName('GT2');
            
            if(mode === '2+1') {
                appendGridMemo(`${subMins(time, 19)} #${stName} 계통분리\n${subMins(time, 10)} #${gt1Name} 계통분리\n${subMins(time, 2)} #${gt2Name} 계통분리`);
                showToast(`2+1 시차분리 입력 완료`);
            }
        }

        function autoResize(el) {
            if(el) {
                el.style.height = 'auto';
                el.style.height = (el.scrollHeight + 2) + 'px';
            }
        }

        function copyMemo(id) {
            const text = document.getElementById(id).value;
            if(!text || text.trim() === "") {
                showToast("복사할 내용이 없습니다.", "error");
                return;
            }
            if(navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showToast("📋 클립보드에 복사되었습니다!");
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
                document.execCommand('copy');
                showToast("📋 클립보드에 복사되었습니다!");
            } catch(e) {}
            document.body.removeChild(ta);
        }

        function showToast(msg, type = "success") {
            const box = document.getElementById('toast-container');
            const el = document.createElement('div');
            el.className = `flex items-center justify-center gap-2 px-4 py-2.5 rounded-full text-xs font-bold shadow-xl transition-all duration-300 translate-y-3 opacity-0 text-white ${type==='success'?'bg-blue-600 border border-blue-400':'bg-rose-600 border border-rose-400'}`;
            el.innerHTML = `<span>${msg}</span>`;
            box.appendChild(el);
            requestAnimationFrame(() => setTimeout(() => el.classList.remove('translate-y-3', 'opacity-0'), 10));
            setTimeout(() => {
                el.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => el.remove(), 300);
            }, 1600);
        }
    </script>
</body>
</html>
